[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-local-rag"
version = "0.0.0"
description = "Contracts and a synthetic benchmark for local multilingual retrieval over pluggable text sources."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "samohod4ik" }]

[project.scripts]
mlrag = "multilingual_local_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "benchmarks"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["multilingual_local_rag"]
mypy_path = "src"
